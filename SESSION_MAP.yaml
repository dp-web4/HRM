    returns None on ANY failure (non-zero exit, its 45s timeout, or a bare `except Exception: return None`), and generate_teacher_turn()
    then falls through to _fallback_prompt(), which is random.choice() over a hardcoded ~19-string bank. Nothing is logged,
    no field is set, and the resulting session gets a number, an R6/T3 score and a commit exactly like a live-tutor session.
    The field literally named `prompt_health` does NOT capture it (it describes the MRH digest builder) and reports IDENTICAL
