  self_finding_2026_08_16_max_turn_length_cannot_see_sprout_fallback: 'A constant reading is not a passing one. tutor_regime
    for sprout was being asserted from max tutor turn length (>=250 => LIVE), the fleet threshold validated at n=90 with zero
    overlap. Zero overlap was real but it measured BANK SIZE, not liveness: nomad/legion-12b banks max at 88 chars, sprout''s
    bank contains a 389-char item that fires every session. So sprout''s positive branch was unreachable-negative - the discriminator
    could not report FALLBACK for sprout no matter what the tutor did. The correct instrument already existed and was used
    on hub and pub (see finding_2026_08_09_tutor_outage_invisible and the outage-date fields on those instances); it was simply
    not applied to sprout, and the cheaper proxy filled the gap. CANONICAL RULE GOING FORWARD: tutor liveness is NOVEL-TUTOR-TURN
    COUNT PER SESSION, computed against that instance''s own full history (md5 of turn text, first-appearance semantics).
    It is backfillable to every session ever recorded, needs no code change, and is the observable OWNER-ACTION 2''s discarded
    stderr would have produced. Length is never to be used as the liveness signal again for any instance.'
  self_finding_2026_08_18_ahead_count_cannot_see_gate_compliance: '''AHEAD N'' ON A GATE-PROTECTED REPO IS THE EXPECTED STEADY
    STATE OF CORRECT COMPLIANCE, NOT A STRANDED PUSH. I found web4 local main ahead 1 with a clean tree, carrying Publisher''s
    08-16 whitepaper commit bc4c5c3, and logged it as OWNER-ACTION 8 firing again. Then my own push to main was REFUSED by
    a machine-global pre-push guard (~/.local/share/git-census/pre-push-guard, installed by dp 2026-08-01, PROTECTED_REPOS_DEFAULT
    ''^(web4|hestia)$'', PROTECTED_RE ''^(main|master)$''; SAGE/Synchronism/memory/private-context are NOT protected, which
    is why every other push this run succeeded). The guard names two routes; route 1 is ''push a branch and open a PR''. I
    took route 1 - and discovered bc4c5c3 WAS ALREADY on origin/publisher/whitepaper-log-2026-08-16 as its tip. The Publisher
    had complied correctly. Nothing was ever stranded. My duplicate branch was deleted and local main reset to origin/main.
    THE OBSERVATION THAT MATTERS: when a repo forbids direct pushes to main, a track that complies by pushing a BRANCH necessarily
    leaves local main permanently ahead, and that residue is BYTE-IDENTICAL to a failed push. The ahead-count is not merely
    a weak signal here, it is the SAME reading for correct compliance and for total failure, and it will grow monotonically
    with every future Publisher run. DETECTOR REPAIR, mandatory before any future stranded-push claim: run `git branch -r
    --contains <sha>`. If any remote branch contains it, the work reached the remote and there is no fault. Never infer stranded
    from ahead-count on web4 or hestia. This is the second time this failure mode has cost me a false fault report (see the
    08-08 hard limit on push-gap reasoning); the difference is that this time the check that settles it is cheap, local, and
    now written down.'
  self_finding_2026_08_18_counting_rule_text_and_execution_diverged: 'THE CANONICAL COUNTING RULE CAUGHT ITS OWN ERROR ONE
    RUN AFTER BEING WRITTEN - because it recorded its REF. counting_rule_CANONICAL asserted ''2832 = paths matching sage/instances/*/sessions/session_*.json
    in `git ls-tree -r HEAD` on main at 8b766344e''. Re-run against that exact ref: 2826, not 2832. The 6-file gap is CONSTANT
    and fully explained: six legacy files carry a suffix after the number (sprout-qwen2.5-0.5b/sessions/session_009_experimental_dry_run.json
    and five siblings). The loose glob session_*.json MATCHES them; the strict regex session_[0-9]+\.json does NOT. The 08-15
    run executed the loose glob and wrote down a strict-sounding paraphrase, so the recorded VALUE and the recorded DERIVATION
    were never the same measurement. The 08-16 run then did not re-derive at all and carried 2832 forward while the true value
    was 2842. The lesson refines the 08-06 fix rather than replacing it. ''Write the rule beside the number'' was right and
    IT WORKED - recording the ref is exactly what made this checkable. But a paraphrased rule is not a rule: the PATTERN is
    part of the measurement, and if the text''s pattern and the executed pattern differ, the next run re-derives a different
    number and cannot tell whether the world changed or the rule lied. Rules must be copy-pasteable and exact. Both values
    are now recorded explicitly so neither can drift silently again.'
