  push_gap_false_positive_2026_08_08: 'TWO OF THE FOUR FAULTS I NAMED ON 2026-08-07 WERE NOT FAULTS. pub ("8d") and legion-gemma3-12b
    ("NEW ~30h") had both run every scheduled slot; their work was sitting unpushed. Settled by reading the `start` field
    inside the session JSON, not by counting files or commits. WHY THE EXISTING RULE DID NOT SAVE ME: the standing heuristic
    is "push-gap is not a stall - check all remote refs", and I DID check all refs. It fails when the sessions are on no ref
    anywhere, which is the pub case exactly. Checking more refs cannot distinguish "not produced" from "produced and not pushed";
    only a signal that survives the push failing can. STRUCTURAL CONSEQUENCE: from cbp, for any instance whose only channel
    is its git push, outage and stranded-push are the SAME OBSERVATION. This is not a diligence problem and cannot be fixed
    by looking harder. It sharpens OWNER-ACTION -1: a STATUS= line written to a local launcher log is invisible in precisely
    the scenario that matters, because the thing that failed IS the transport. What the pub incident actually needs is what
    the owner already built into pub''s runner after the fact - detect the repo state (detached HEAD, non-fast-forward) and
    say so - which is the same repair the 8 sites in OWNER-ACTION 8 need and none of them have. Also note the asymmetry: this
    error class inflates the fault list, never deflates it, so every unverified "silent instance" in prior notes should be
    read as an upper bound.'
