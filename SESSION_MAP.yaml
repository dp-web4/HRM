    finding_2026_08_20_pub_local_tutor_fault: 'PREDICTION REGISTERED 2026-08-19 IS REFUTED, AND THE REFUTATION IS THE FINDING.
      The claim was ''S105''s 0-hapax relapse is a one-session blip''; refute condition was ''S106 and S107 both 0 hapax''.
      Observed: S106 0/5, S107 0/5, and it did not stop -- S108 0/5, S109 0/5. Five consecutive all-fallback sessions, S105
      (08-19T04:24Z) through S109 (08-20T04:21Z), 24h, ONGOING at scan time. WHY THIS IS PUB-LOCAL AND NOT THE ACCOUNT LAYER,
      settled by interleaving rather than by argument: sprout ran S591 (08-19T13:05Z, 1 hapax), S592 (19:08Z, 5), S593 (08-20T01:05Z,
      2), S594 (07:08Z, 2) -- one sprout session with novel tutor content lands between EVERY consecutive pair of failed pub
      sessions. Since a novel string cannot come from the bank, hapax>=1 is a positive existence proof that a tutor subprocess
      call succeeded; the shared Claude account was therefore reachable continuously across pub''s entire failure window.
      FIRST OF ITS KIND: pub has had five all-fallback episodes ever (S007-S016, S044, S062-S064, S095-S101, S105-S109). The
      first four were each shared with sprout and/or hub on other machines, i.e. account-layer. S105-S109 is the first that
      is NOT shared -- the first pub-HOST fault in the instance''s history. MECHANISM NARROWED BY DURATION, and this is the
      part that is actionable: pub''s fallback sessions run 15.5-20.9s wall clock (5 turns), its live ones 50.6-179.2s. _call_claude
      carries timeout=45 per call, so a timing-out tutor would floor a 5-turn session at ~225s. Pub''s failures are ~18s.
      The tutor is therefore NOT hanging or timing out -- it is exiting non-zero within milliseconds. That signature fits
      an expired/invalid credential, or _find_claude_binary() falling through its three candidate paths to bare ''claude''
      and hitting exit 127 under cron PATH. It does NOT fit network latency, rate limiting with retry, or model load. WHY
      THE DIAGNOSIS STOPS HERE: adaptive_prompts.py:46 returns None on any non-zero exit, discarding returncode and stderr,
      and :47-48 swallow every exception bare. The distinguishing evidence exists on pub and is thrown away at the moment
