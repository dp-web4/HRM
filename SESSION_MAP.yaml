      free to vary, and hub''s turn count varies 3-8 session to session. Measured as TOTAL SAGE characters per session, hub
      S104-S112 = 1128/1643/3069/2209/1811/3423/2944/4356/3347 against a S085-S112 median of 3178. S106 — the first session
      of the alleged ''monotonic slide'' — is 3069, i.e. AT THE MEDIAN. It only looked like a floor because it spread the
      same volume over 8 turns instead of 6. S107/S108 (2209/1811) are low-normal, comfortably above S096 (1163) and S100
      (1430), neither of which was ever treated as an onset. There was no decline in output; there was a decline in a ratio
      whose denominator moved. CONTRAST WITH A REAL EPISODE: cbp-gemma3-4b episode 2 (S170-S179) totals 444/517/873/782/2953/1125/775/580/661/1477
      against a ~2500-7000 baseline — 8 of 10 sessions under 1500, i.e. 15-25% of normal volume. Both metrics agree there,
      and the collapse is unambiguous in either. The two metrics only diverge in the ambiguous regime, which is exactly the
      regime where escalation decisions get made. REVISED RULE (supersedes the avg-only formulation): score thin sessions
      on TOTAL SAGE CHARACTERS PER SESSION against the instance''s OWN median, and treat avg-turn-length as a secondary descriptor
      only. The ''thin session is a leading indicator'' lesson SURVIVES this correction — cbp''s two genuine leading-edge
