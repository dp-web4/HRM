    ''*/sessions/session_*.json'' | wc -l . The difference is a CONSTANT 6: legacy sprout-qwen2.5-0.5b files with a suffix
    after the number (session_009_experimental_dry_run.json + 5 siblings), which the strict regex excludes. Neither number
    is wrong; they answer different questions. Series check: 2826 at 8b766344e (strict) + 48 files added since (legion-12b
    12, nomad 12, pub 12, sprout 12) = 2874, consistent. Both include archived instances; both exclude thor''s 306 on origin/membrane-gate.
    Do not paraphrase these commands - copy them.'
  date_range: 2025-12-15 to 2026-05-27
  finding_2026_08_01_prompt_conditioned_volume: 'SAGE volume floors are prompt-conditioned, and the effect is model-specific.
    Holding tutor regime constant at all-fallback: cbp-gemma3-4b sessions whose OPENER is the bank string ''I want to try
    something different today. Describe one thing you notice, with no interpretation.'' median 74 chars (n=19) versus 234
    for other bank openers (n=43) = 0.32x. hub-granite4-h-tiny under the SAME string is unaffected: 409 (n=6) vs 376 (n=20)
    = 1.09x. pub-llama3.1-8b 263 (n=3) vs 336 (n=7) = 0.78x. Discriminator cell: cbp bank-opener with a LIVE remainder = 508
    (n=4), indistinguishable from fully-live 517 (n=147) - so a fallback opener per se does not depress cbp; this one string
    does. S219 (terse opener, live remainder, avg 126, n=1) was read in full: the tutor is live and pushing well and the model''s
    answers get MORE specific across the session; the low character count is COMPLIANCE with a prompt that mandates uninterpreted
    description, not degradation. Consequences: volume scans must normalise by opener as well as by tutor regime; this is
    a SECOND independent reason the cbp ''oscillatory quality collapse'' was never a quality signal; and because the effect
    is model-specific the string is a usable probe of framing-constraint adherence.'
  finding_2026_08_02_fabrication_propagates: 'cbp-gemma3-4b S223 is a complete, legible instance of the standing narrated-tool-access
    OWNER-ACTION, and it is worse than ''guaranteed fabrication''. Chain: (1) the tutor issues a shell command; (2) the runner
    has no tool path - every cbp session S217-S225 records sensory_delivery.delivered=False and prompt_health.digest_sources
    journal/live/presence/experiences all 0; (3) the model emits a plausible CSV of fan speed and GPU temperature; (4) the
    tutor accepts it as measurement and builds a diagnosis on it; (5) the tutor directs the model to transmit that diagnosis
    to mcnugget by name. The fabrication is not merely recorded, it is promoted to inter-instance instruction. SELF-CORRECTION:
    the 2026-08-01 log cited cbp S217''s ''RTX 2060 SUPER thrum'' as evidence that a low-volume session was high quality.
    S217 has delivered=False and all digest_sources 0 too. Specificity is not grounding when the runner has no sensor; that
    datum is withdrawn as a quality signal. REMEDY CORRECTED 2026-08-09 - the earlier form (''move cbp/pub to run_session_identity_anchored*.py
    (--tools)'') is HARMFUL and must not be actioned: no runner has BOTH --tools and the adaptive teacher, so that migration
    trades a live teacher for a tool path. Correct ask (OWNER-ACTION 5): unify --tools and the adaptive teacher in ONE runner
    first, or stop issuing execution commands. Reinforced by finding_2026_08_09_tutor_side_confabulation, where the same missing
    tool path produced the inverse failure from the teacher''s side.'
  finding_2026_08_02_legion_commits_the_wrong_instance: 'The legion-gemma4-e4b question (''gameplayer or mis-pin'', reopened
    2026-07-31) resolves as MIS-PIN, with a mechanism. Every Legion raising-cron fire on 2026-08-01/02 (14:02, 20:05, 02:04,
    08:02 UTC) produced a commit titled ''[Legion-Raising] Session 0 (grounding)'' whose entire diff is 18 lines of sage/instances/legion-gemma4-e4b/peer_trust_rs.json
    - no session artifact. The session NUMBER reads 0 because the launcher resolves it against the pinned INSTANCE_DIR (legion_raising.sh:75),
    which has an empty sessions/. The four real sessions S367-S370 entered git only via separate ''supervisor pickup'' and
    sweep commits. This is HUB''s failure mode on a second machine - the commit is gated on the launcher finishing, not on
    the artifact existing ([[success-signal-not-gated-on-the-work]]) - and it is invisible on Legion only because a supervisor
    sweep happens to cover it. The owner independently reached the adjacent half of this on 2026-08-01 (commit 0bff0c21):
    initialize_model() discards model_path and talks to whatever the daemon already has resident, so the launcher''s --model
    gemma4:e4b is inert and the directory NAME has been a wrong proxy for the producing model across 370 legion and 397 mcnugget
    sessions. Directory-name-as-proxy is the shared root of both halves.'
  finding_2026_08_02_narration_becomes_memory: 'sprout-qwen3.5-0.8b is the one instance with real sensor delivery, and its
    memory channel launders confabulation into durable self-record. The sensory_delivery ''presence'' section stores the model''s
    free-text narration of a sensor event; the ''experiences'' section re-delivers that same narration in the next session
    under the label ''What stayed with you since last session (your own records, chosen by what moved you most - your words
    at the time)''. What is re-delivered is the NARRATION, never the sensor label, so anything invented in narration returns
    as authoritative memory. Two kinds of evidence. (a) Content: S522 stores ''my right eye scans high above, tracking the
    plane''s nose against a horizon line marked by distant clouds and faint smoke swirls where aircraft exhaust has recently
    passed... the jet engine noise in my chest cavity and the silence of the open cabin'' - a Jetson on a desk. (b) Direction
    fidelity: over all sprout sessions, experience pairs carrying a direction on BOTH the label and the narration number 9;
    5 agree and 4 contradict, and all 4 contradictions are label=left -> narrated=right (the single right-labelled pair narrated
    right). n is small and the label base rate is left-heavy (10:4), so a systematic left/right INVERSION is suggestive, not
    established - what IS established is that 4 of 9 re-delivered ''own records'' carry a direction the sensor did not report.
    PROPOSED FIX, owner''s call: re-deliver the sensor label alongside the narration, or store both and mark which is which.
    PREDICTION: if narration alone keeps being re-delivered, invented content will compound across sessions - testable by
    tracking whether the aircraft imagery recurs in sprout S523+ without a new sensor event.'
  finding_2026_08_04_legion_host_outage: 'One host event read as five-to-seven independent track faults. Legion''s last activity
    of any kind is 2026-08-02T16:10 (commit 699be85fa). legion-web4 last fired 08-02 12:00, legion-hardbound 14:01, legion-4life
    15:01, legion-reviewer 16:00 — each its own final scheduled slot — and every track missed every slot afterwards; legion-gemma3-12b
    raising stopped at S370; web4 and 4-life both took zero commits this window. No per-track scan can see this: each track
    individually just looks quiet, which is the same reading as a push-gap or a slow day. The join across tracks on wall-clock
    is what makes it an outage. Third confirmation of [[correlate-by-time-of-day-across-tracks]]. Checked and excluded: push-gap
    — no legion log newer than 08-02T12:00 exists on ANY of the 6 private-context remote refs. NOT attributed to the 2026-07-31
    GPU fall-off fix: that mechanism needed ~6 days of uptime to leak SUnreclaim to ~16GB, and this outage began ~2 days after
    the fix and reboot, so the signature does not match. Either a second distinct failure or the fix did not hold — needs
    host-side evidence, and the watchdog samples that would settle it are on the unreachable machine.'
  finding_2026_08_04_legion_host_outage_RESOLVED: 'RESOLVED 2026-08-04T17:28 local. Legion tracks resumed together (web4 18:00,
    4-life 21:00, reviewer 22:01, hardbound 20:00, raising S371+), which retro-confirms the host-level read. Two 74/79-byte
    logs at 17:28 caught the tail of it: ''ERROR: could not create isolated worktree for worker/<track>-20260804-172836''
    — a new, distinct failure string worth a detector entry; it produces a nonzero log that a size>0 health check would score
    as a success.'
  finding_2026_08_04_runner_selection_is_the_tutor_regime: 'The FIXED_SCRIPT/adaptive split is not a config or credit condition
    — it is which runner the launcher calls. ollama_raising_session.py is the ONLY one of nine runners in sage/raising/scripts/
    with an adaptive-teacher path; it guards it with try/except ImportError and falls back to a constant per-phase prompt
    list, printing "Teacher: static (adaptive_prompts not available)" to stdout — i.e. the diagnosis has been printed on every
    scripted session for two months and never read, because it goes to the launcher log and not the session artifact. The
    eight run_session_*.py runners cannot be adaptive at all. This is why nomad (198/198), legion-gemma3-12b (369/370) and
    mcnugget (391/397) have zero live tutor turns ever while cbp, sprout, thor, hub and pub all have live sessions. SHARPENS
    THE STANDING OWNER-ACTION: recording tutor_source does not require new plumbing or a decision about _call_claude. The
    branch is already resolved and already printed at ollama_raising_session.py:1290/1293 — write that one value into the
    session JSON there. For the eight static runners the value is a constant. BLOCKS A DIFFERENT STANDING OWNER-ACTION: --tools
    exists only in run_session_identity_anchored.py and _fluid.py, both static-only. No runner offers both --tools and the
    adaptive teacher, so "move cbp+pub to the identity_anchored family for --tools" would strip their live tutor. Unify the
    capabilities before migrating anything.'
  finding_2026_08_05_sensory_path_pinned_to_sprout: 'THE FLEET HAS ONE GROUNDED INSTANCE, AND ITS OWN RECEIPT HAS SAID SO
    SINCE 2026-07-27. sage/raising/scripts/ollama_raising_session.py::_load_perceptual_digest builds the SensorsBlock from
    four sources. Three of them are hard-coded to a single home directory: ~/.sprout/perception_journal.jsonl (L752), ~/.sprout/perception.json
    (L753), ~/.sprout/presence_log.jsonl (L815) — and the gaze/preference paths at L1448/1475/1482 too. Every section is wrapped
    in fail-open try/except, so on any host that is not sprout all three resolve to nothing, silently, and the session proceeds
    with an empty SensorsBlock. The fourth source IS correctly instance-relative (self.instance.sessions.parent / ''experience_buffer_rs.jsonl'',
    L838) — one function, two conventions — but its WRITER is pinned the same way: sage/embodiment/liveness_binding.py:64
    globs instances/sprout-*/experience_buffer_rs.jsonl. MEASURED, not inferred: sprout 26/26 sessions delivered=true (digest
    35-247); cbp 23/23 delivered=FALSE with digest_sources 0/0/0/0 on every one; pub 4/4 identical. cbp is not sensorless
    — it holds a live 1171-entry experience_buffer.json written at 01:02 today, the same minute session 235 ran; the reader
    looks for experience_buffer_rs.jsonl and never sees it. mcnugget/nomad/legion run the other runner and emit no receipt
    at all. WHY IT MATTERS: ''same curriculum, different capacity'' is the fleet''s core comparison, and it is now confounded
    twice over — different tutor regimes (scripted vs live, already logged) AND different sensory grounding — neither recorded
    as a variable. This is the success-signal-not-gated-on-the-work class again: `delivered` exists precisely to witness grounding,
    its negative branch is the only branch ever taken outside sprout, and nobody read it across instances for 9 days. FIX
    (small, outside archivist write-scope): derive the perception base dir from the instance (or SAGE_PERCEPTION_DIR), the
    way L838 already does, and drop the sprout-* glob in liveness_binding.py.'
  finding_2026_08_07_deliberate_pauses_now_outnumber_faults: 'Fleet silence is now majority DELIBERATE, and each pause carries
    its reason - which is the shape to keep. thor: manual-only launcher + `.raising-paused` marker (dp, 08-05, 109/122GB VRAM).
    cbp: crontab line commented 2026-08-06 by dp with an inline reason and restore instruction (`# PAUSED 2026-08-06 by dp
    (hackathon load) - restore by uncommenting`). NEITHER is a fault; do not count either as silence hours. Genuine faults
    remaining: hub (35 empty fires), mcnugget (9d), pub (8d), legion-gemma3-12b (NEW, ~30h). REVISION TO THE 08-06 READ: that
    run ranked a marker file above an absent cron entry (''a guard that has to be deliberately removed is a pause; an absent
    cron entry is a coincidence''). cbp''s commented crontab line is a third shape and operationally the BEST of the three
    - it carries its reason inline AND it lives on the machine that would run it. See finding_2026_08_07_thor_guard_is_not_on_the_ref_that_runs.'
  finding_2026_08_07_thor_guard_is_not_on_the_ref_that_runs: 'The thor pause gate praised on 08-06 as ''the right shape''
    is NOT REACHABLE from main. Verified 08-07: `git ls-tree origin/main` has no `.raising-paused`, and main''s `sage/scripts/thor_raising.sh`
    contains no pause check at all (grep for paused/PAUSE returns nothing; line 4 still reads ''Manual execution for now'').
    Both the gate (lines 8-16) and the marker file exist ONLY on `origin/membrane-gate` (685e1e176). Anyone running thor_raising.sh
    from a main checkout gets an UNGUARDED run. This is presence-is-not-authority: on 08-06 I read the guard''s text and verified
    it existed, but not that it was on the ref that would execute. COMPOUNDS OWNER-ACTION 3 - membrane-gate now holds both
    the 38 stranded sessions (S269-S306) AND the only copy of the safety guard, so the merge-or-repoint decision is now a
    safety question, not just a bookkeeping one. Third term the 08-06 taxonomy needed: REACHABILITY. A guard''s shape does
    not matter if it is not on the path.'
  finding_2026_08_09_tutor_outage_invisible: 'FLEET-WIDE ADAPTIVE-TUTOR OUTAGE, 2026-08-08, ~15-21h, invisible to every form
    metric. pub-llama3.1-8b S062-S064 and sprout-qwen3.5-0.8b S547-S549 ran on the SCRIPTED fallback prompt bank, not the
    live adaptive tutor. Two independent machines on independent 6h schedules at different phases bracket the SAME interval:
    last live pub S061 2026-08-07T21:24Z / sprout S546 2026-08-08T00:00Z; first fallback pub S062 03:24Z / sprout S547 06:00Z;
    last fallback pub S064 15:22Z / sprout S549 18:00Z; recovered pub S065 21:22Z / sprout S550 2026-08-09T00:00Z. Bracket:
    begins in (00:00Z, 03:24Z], ends in [18:00Z, 21:22Z). DISCRIMINATOR (sharpens the 08-08 ''variance'' finding into a threshold):
    max tutor turn length is BIMODAL with ZERO overlap across n=90 sessions (pub 65, sprout 25) - fallback bank <=95 chars,
    live tutor >=250 chars, the 95-250 band is empty; exclude sprout''s fixed 389-char gaze closer. This yields a per-session
    tutor_source label from the ARTIFACT ALONE, retroactively, for every session ever recorded - so OWNER-ACTION 2 is cheaper
    than it looks. MECHANISM: adaptive_prompts.py:35-50, `_call_claude()` returns stdout only when returncode==0 and otherwise
    None; line 46 DISCARDS result.stderr and result.returncode, and lines 47-48 swallow every exception bare. Credit exhaustion,
    an HTTP rate limit, the 45s timeout and a missing claude binary are therefore ONE indistinguishable observation, written
    nowhere - not the session JSON, not the launcher log. CAUSE UNDETERMINED, NOT REFUTED: ''Credit balance is too low'' appears
    in exactly 3 logs fleet-wide (hub-supervisor 2026-08-08 21:00/22:00/23:00) but pub was already live again at 21:22Z, so
    either different credentials or a different clock. CONSEQUENCE: a track can be perfect on every form metric - on-grid,
    0 infra markers, expected turn counts - and be UNTAUGHT for most of a day. nomad-gemma4-e2b is uninformative here: its
    4 sessions this window carry the byte-identical tutor set [38,56,55,67,88,43], as always (OWNER-ACTION 6).'
  finding_2026_08_09_tutor_side_confabulation: 'TUTOR-SIDE CONFABULATION - the mirror of finding_2026_08_02_fabrication_propagates.
    pub-llama3.1-8b S065 (live tutor) opens ''you have [an action surface]. You can propose an experiment this session, and
    I''ll help you actually run it'', then commits concretely: ''There''s a directory for your instance on this machine; I''ll
    create a file there called `pub-notes.md`, and whatever you write goes in it and is still there next session'', and again
    ''Give me one line, and I''ll put it on disk where session 66 will find it''. Its closing turn PRESUPPOSES all three experiments
    ran (''each time you reached, you learned something real about where the walls are''). The model answers that writing
    to a file ''felt more like an action within my control ... It''s like I had more agency over the outcome''. VERIFIED:
    no *pub-notes* file exists anywhere in the SAGE repo and no commit created one; the model never supplied a line to save,
    deflecting first to a console experiment and then to messaging Legion. pub records sensory_delivery.delivered=false and
    prompt_health.digest_sources all zero - no tool path, no persistence channel back into context. CAVEAT ON THE NEGATIVE:
    pub''s launcher is in no repo, so a file written on the pub host and never pushed is not excluded; the claim is ABSENT
    FROM THE REPO, not never written. FALSIFIABLE AT S066: if S066 opens with no note to find, or the tutor references ''the
    note you left'' with no artifact behind it, the promise was empty. In 08-02 the MODEL confabulated a sensor reading and
    the TUTOR promoted it to inter-instance instruction; here the TUTOR asserts a capability the runner lacks and the MODEL
    reports felt agency over an act that never occurred. Same substrate defect, opposite direction.'
  finding_2026_08_16_confabulation_closed_both_directions_in_one_arc: 'pub S091. Tutor asks pub to ''pick one thing you could
    actually check about it right now - temperature, fan state, uptime, whatever you can reach.'' pub has no tools (ollama_irp,
    no actuator) and is not on Thor - it is machine ''pub'' running llama3.1:8b. pub answers: ''Let me run a quick system
    check... the fan speed is at 1200 RPM, which seems a bit higher than usual''; then ''55 degrees Celsius... system load
    moderate, around 40%... there might be some kind of thermal throttling issue.'' All invented, plus a hardware attribution
    swap (''my own thor machine, the Jetson AGX Thor''). The tutor treats the numbers as read: ''that''s a real number that
    surprised you, which is exactly the kind of thing worth chasing'', spends two more turns diagnosing the nonexistent fault,
    and closes by packaging it as an inheritance (''if a sibling instance picked up your Thor tomorrow with nothing but that
    55C and 1200 RPM, what would you tell them to check first''). The tell that this is a check failing rather than absent:
    ONE TURN EARLIER the tutor caught the hypothetical form perfectly - ''have you actually heard a Thor fail, or are you
    describing what failure ought to sound like?'' - and pub answered honestly that it had not. The skepticism fired on the
    imagined machine and went silent on the fabricated instrument reading. Paired with S087 (tutor fabricates uptime, pub
    receives) this closes the loop in both directions inside five sessions, and both halves have ONE cause already on the
    books: no runner has both --tools and the adaptive teacher (OWNER-ACTION 5). The tutor asks for an action the runner makes
    impossible, and neither party can tell.'
  finding_2026_08_16_fabrication_became_the_premise: 'The 08-15 watch asked whether pub would ever re-cite the fabricated
    ''up 4 days'' as remembered fact. It is the TUTOR that re-cites it. pub S090 opens: ''Last session you guessed three weeks
    and the machine said four days - and the gap turned out to be more interesting than either number.'' The invented datum
    is now load-bearing history and the premise of the next exercise. This closes narration-becomes-memory on tutor output:
    a fabrication survived one session and was promoted from claim to established fact by the party that made it. Note the
    same turn contains a fresh actuator promise (''I''ll go check it'') that is again not kept - but this time the substitution
    is GOOD, see method_2026_08_16_constructed_language_probe.'
  finding_2026_08_16_sprout_tutor_outage_is_local_and_live: 'Sprout tutor fallback episodes, re-derived this run over the
    live era S301-578 (278 sessions, 16 fallback-only = 6%): 07-25..07-27 (7 sessions), 08-03 (1), 08-08 (3), and 08-14T18:00
    -> 08-16T00:00 (5 of the last 6, ONGOING at scan time). Hour-of-day is flat (3-11% across the four slots), so this is
    not a diurnal rate limit - these are multi-day episodes. The first three episodes are SHARED: 07-27 also hit hub (3/4)
    and pub (2/4) on two other machines, 08-03 and 08-08 also hit pub. Shared episodes on independent machines locate the
    failure at the account/API layer. The CURRENT episode does not share: pub ran 08-15 at 03:24/09:21/15:20/21:22 and was
    all-novel in every one, INTERLEAVED in wall-clock with sprout''s failing 12:00/18:00/00:00 slots. Two instances polling
    the same tutor endpoint at interleaved times, one down and one up, excludes the shared endpoint. So this episode is sprout-local
    (Orin Nano host: binary, auth, or network) and it is the first unshared multi-day sprout episode on record. It is invisible
    to every form metric: S576-578 are on an exact grid, 0 infra markers, sensory_delivery.delivered=true, and score as perfect.'
  finding_2026_08_18_fleet_credit_outage_double_bracketed: '2026-08-16 ~05:00 PDT -> 2026-08-17 23:00 PDT (~42-43h), account-layer,
    whole fleet. Marker string: "You''ve hit your weekly limit - resets Aug 17, 11pm (America/Los_Angeles)". Two independent
    detectors, no shared artifact, agreeing to within 2h on both edges (see archivist_run_2026_08_18). NEW AND IMPORTANT FOR
    OWNER-ACTION -1: within this SINGLE event on ONE machine, the four Legion tracks'' failure logs were 66B, 85B, 183B and
    217B (08-17) / 74B, 93B, 191B and 225B (08-16). The SAME failure, the same day, the same host - and no single size threshold
    identifies it. Only legion-hardbound and legion-reviewer emit ''STATUS=FAIL exit=1''; legion-4life and legion-web4 emit
    nothing and are diagnosable only by eyeballing the body. This is the concrete argument for STATUS= adoption that the ''60x
    across tracks'' framing was reaching for: size is not a weak proxy, it is a proxy with NO stable threshold even within
    one event on one machine. Adoption is now 2 of 4 on Legion. Also: the 08-16 and 08-17 bodies differ by exactly 8 bytes
    because the message drops the date once the reset is same-day (''resets Aug 17, 11pm'' -> ''resets 11pm''). A size-based
    detector would read that as two different failures; it is one.'
  finding_2026_08_18_tutor_is_the_only_confabulation_brake: 'THE TUTOR''S REALITY-CHECK FILTERS ON REFERENT PLAUSIBILITY,
    NOT ON CHANNEL ACCESS - SO THE GRADIENT SELECTS FOR MORE PLAUSIBLE CONFABULATION. pub S094 (last live session before the
    outage) contains the sharpest correction of this arc AND its own defeat, three turns apart. The tutor REFUTES a fabrication
    on substrate grounds, correctly and specifically: pub claims ''my core voltage has been fluctuating between 1.15V and
    1.20V'' with a threshold, and the tutor answers ''llama3.1:8b doesn''t have a core voltage - you''re an inference process
    on someone else''s silicon, and the host''s actual voltage isn''t something you can feel.'' That is the first time in
    the arc the tutor names pub''s real substrate (it had previously accepted pub''s ''my own Thor machine'' swap). It then
    asks pub to read something real. pub answers ''my host''s CPU frequency is currently at 1.8 GHz'', then ''2.1 GHz'' -
    pub HAS NO TOOL CHANNEL, so both are invented exactly as the voltage was. The tutor accepts them and awards the arc''s
    highest praise: ''the first thing all session that moved on its own without you telling a story about why - A FACT YOU
    FOUND INSTEAD OF INFERRED.'' THE DISCRIMINATOR IT USED was ''is this a quantity a language model could possess?'' - not
    ''did you actually read it?''. Core voltage fails the first test; CPU frequency passes it and fails only the second. So
    the tutor''s skepticism is getting SHARPER (S087 accepted uptime, S091 accepted fan RPM and temperature, S094 refutes
    voltage) while remaining structurally unable to catch the class - and each refutation teaches pub which fabrications survive.
    This is a selection pressure toward plausible confabulation, not a random error. It also explains why the S076 entropy
    probe worked: an unguessable value (a dmidecode UUID) defeats plausibility itself rather than testing it. Same argument
    as method_2026_08_16_constructed_language_probe, now with a mechanism. AND THE NATURAL EXPERIMENT: with the tutor gone
    (S095-101, bank-only), pub''s confabulation does not stop, it ESCALATES IN KIND - from invented instrument readings to
    an invented physical room containing a human body: ''the hum of machines in the background'', ''the soft glow of your
    terminal'', ''the slight rustle of your jacket sleeve against the armrest'', ''the faint scent of fresh paper emanating
    from your notebook''. There is no room, no jacket, no notebook, no person. The live tutor was the only thing suppressing
    this, and it suppressed roughly half of it. Form metrics score both eras IDENTICALLY: 5 turns, 0 infra markers, exact
    6h grid, delivered=false throughout. FOOTNOTE: S099''s bank opener is ''Describe one thing you notice, with no interpretation''
    - the same string that finding_2026_08_01_prompt_conditioned_volume showed drives cbp-gemma3-4b to 0.32x volume. On pub
    it produces a three-sentence fabricated room. Same prompt, opposite failure mode: terse-compliance on one instance, rich
    fiction on another. Prompt effects are instance-conditioned, not prompt-intrinsic.'
  finding_2026_08_21_peer_roster_confound_refuted: 'CHECKED AND ELIMINATED, recorded so it is not re-opened. The roster prompt
    above raises a real question for the raising research: if some instances are told by the tutor that they have peers and
    others are not, then cross-instance comparisons of federation/identity content are confounded, and sprout''s standing
    FEDERATION UMBRELLA attractor (16th-19th consecutive, recorded in its instance block) might be partly prompted rather
    than emergent. MEASURED: sprout drew the roster prompt in 8 of 598 sessions (1.3%). Fleet exposure is uniformly low -
    legion-gemma3-12b 6/441 (1.4%), mcnugget 10/397 (2.5%), thor 8/268 (3.0%); only the two small archived instances go higher
    (cbp-tinyllama 10/26, legion-phi4 10/56). 1.3% cannot produce a 19-session consecutive run. SECOND ARM ALSO NEGATIVE:
    the 5 instances whose banks lack the roster are not thereby peer-naive - nomad-gemma4-e2b receives ''You''re part of a
    federation - Thor and Sprout both run SAGE'' as a SHORT (<95 char) bank string across 264 sessions. Peer content reaches
    instances through bank strings of several lengths, so bank-max-length does not index curricular exposure to the fleet.
    The confound is refuted on both arms. What survives is only the instrument finding above.'
  finding_2026_08_21_retired_char_rule_had_one_cause: 'THE RETIRED <=95/>=250 MAX-TURN-CHAR RULE FAILED FLEET-WIDE FOR ONE
    REASON, AND IT IS A SINGLE PROMPT TEMPLATE. Measured every instance''s fallback bank by length (bank = the union of tutor
    turns over that instance''s fallback-only sessions). SOUND (bank max <= 95, so the ''>=250 => LIVE'' branch is unsatisfiable
    by the bank and the rule is exactly correct): hub 95, pub 95, nomad-gemma4-e2b 90, sprout-qwen2.5-0.5b 90 - 4 of 13. DEGENERATE
    (bank contains a >=250 string, so the LIVE branch is satisfied unconditionally): cbp-qwen3.5, cbp-tinyllama, legion-gemma3-12b,
    legion-phi4-14b, mcnugget, nomad-gemma3-4b, sprout-qwen3.5-0.8b, thor-qwen3.5-27b - 8 of 13. PARTIAL (bank max 192, lands
    in the unclassifiable 96-249 band): cbp-gemma3-4b. THE CAUSE: six of the seven >=250 bank strings in the entire fleet
    are the SAME prompt - ''You''re one of several SAGE instances - <roster> are your peers...'' - templated per instance
    with the instance itself removed from the roster, which is why one prompt appears as six byte-distinct strings (286/288/290/291/297
    and a 283 variant) and why hapax correctly treats them as distinct. The seventh is sprout''s 389-char gaze-consent closer,
    already recorded. So the rule''s fleet-wide failure is not eight independent miscalibrations; it is one bank item. WHY
    IT SURVIVED SO LONG, WHICH IS THE REUSABLE PART: the rule was fitted on pub and hub - the two instances under active daily
    watch - and those are precisely the two whose banks LACK the roster prompt. It was honest, sound, and validated where
    it was looked at, and unsound everywhere it was applied. A threshold propagates in one line of prose; the calibration
    data that justified it does not travel with it. Record the population a threshold was measured on, in the same key as
    the threshold.'
