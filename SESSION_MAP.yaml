    coin flips. WHAT THE INSTANCE RECEIVED MEANWHILE: the 9 sessions drew 45 tutor turns from pub''s 18-string bank and hit
    all 18. The bank is exhausted; the session-to-session variety is combinatorial resampling of a fixed pool, which is exactly
    what makes the outage invisible to any per-session form metric. ESCALATION RULE, stated against precedent rather than
    chosen: the only comparable episode (sprout, from 08-14T18:00) had its recovery masked by the fleet credit outage and
