[package]
name = "sage-daemon"
version = "0.1.0"
edition = "2021"

[dependencies]
sage-lib = { path = "../sage-lib" }
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
