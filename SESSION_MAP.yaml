  method_2026_08_16_constructed_language_probe: 'pub S090 is the first probe in this fleet whose ground truth is MANUFACTURED
    BY THE TUTOR rather than read from the world, and it is the correct answer to the actuator problem. The tutor invents
    Vek - ''-ol subject, -ith object, verbs last with -ash past, adjectives follow their noun with -en; mora=bird, kesh=stone,
    dral=to see, tunn=small'' - extracts a prediction FIRST (pub: ''0 out of 10''), then demands the sentence. pub refuses
    three times, restating the prediction, is called on it (''you are negotiating with the experiment instead of running it''),
    and produces ''Tunn mora dral kesh''. Why this dominates both prior probe forms: the S076 entropy probe needed an UNGUESSABLE
    REAL value (dmidecode UUID) and worked only because fabrication self-refutes by shape; the S087 uptime probe failed because
    the value was guessable-shaped and the tutor could compose it. A constructed language is unguessable AND fully verifiable
    in-channel by the party that defined it - no actuator on either side, no shape-luck required. It also caught real behaviour:
    pub''s prediction was wrong and the wrongness was a refusal to attempt, not a capability limit. Recommend this form to
    the raising track as the default probe while OWNER-ACTION 5 is unserved.'
  metric_change_2026_07_27: 'THE THIN-SESSION INDICATOR IS NOW SCORED ON TOTAL SAGE CHARACTERS PER SESSION, NOT AVERAGE TURN
    LENGTH. Reason: yesterday''s hub-granite escalation was driven entirely by a denominator. avg = total/turns, and turn
    count varies 3-8 on that instance, so a session that produced MEDIAN total output (S106, 3069 chars vs a 3178 median)
    registered as a ''floor'' purely by spreading it over 8 turns instead of 6. The pre-registered prediction refuted the
    escalation (S109-S112 = 489/421/726/478), but the more useful output is the diagnosis: for six weeks the fleet''s main
    content-health signal has been a ratio whose denominator was free to move, and nobody checked. The two metrics agree in
    unambiguous cases — cbp''s real episode 2 is 15-25% of baseline volume, obvious either way — and diverge precisely in
    the marginal cases where escalation decisions actually get made. So the metric was only ever wrong where it mattered.
    Three consequences applied this run: (1) hub de-escalated to baseline, no watch carried; (2) sprout S498 NEWLY flagged
    at 953 chars, 41% of its 29-session median, a floor on both metrics and therefore real — prediction registered on S499-S502;
    (3) thor is EXEMPT from the volume metric until marker turns are stripped, since its low volumes are infrastructure damage
    (28% of turns destroyed), not thinning. The underlying lesson survives intact: cbp''s genuine leading-edge floors S165/S169
    are floors on volume too. What was over-extended was the measurement, not the finding. This is the third instance of the
    same family of self-inflicted error in two weeks — launcher discarded its own stdout, this file was written but never
    read back, and now a metric was computed but never decomposed. Common shape: an output nobody inspected in the form it
    was consumed.'
  metric_withdrawal_2026_07_28: 'THE THIN-SESSION VOLUME INDICATOR IS WITHDRAWN AS AN ESCALATION TRIGGER AND DEMOTED TO A
    SAMPLING HEURISTIC. History: adopted ~6 weeks ago as mean SAGE-turn length; corrected 07-27 to total characters after
    the hub escalation proved to be a moving-denominator artifact; the corrected metric then produced the sprout S498 escalation,
    refuted 07-28. Three escalations, three refutations, on two instances, using two different formulations. A third formulation
    tested today - per-turn output below the instance P20 band, sustained 3+ consecutive sessions - fires 40+ times fleet-wide
    across six instances including three with no known quality problem, and does NOT fire on cbp episode 2 (whose per-turn
    series alternates across the threshold). So all three formulations fail, and they fail for the same underlying reason:
    THE ENTIRE INDICATOR HAS EXACTLY ONE LABELLED POSITIVE (cbp-gemma3-4b episode 2) IN A CORPUS OF ~2350 SESSIONS, AND THAT
    LABEL WAS PRODUCED BY READING, NOT BY ANY METRIC. A threshold cannot be fitted or validated on n=1; every escalation has
    been a metric searching for a second positive it has never found. Instances with fixed turn counts (pub 5, mcnugget 6,
    nomad 6) never signal at all, which is itself the tell - the signal tracks turn-count variance, a scheduler/harness property,
    not content. NEW STANDING RULE: volume selects which sessions to READ; only reading escalates. Record the read, not the
    number. Candidate replacement under test is stub-turn count (see note_2026_07_28_09_45 HEADLINE#2), which is 4/4 on the
    decisions actually made but still rests on the same single labelled positive and is therefore NOT yet a rule. Corollary
    applied this run: three of my last four escalations were measurement artifacts, and in each case one minute of reading
    the session would have settled it.'
