  tutor_liveness_instrument_CANONICAL: 'HAPAX = a tutor turn whose exact text appears in exactly ONE session of that instance,
    ever. TWO READINGS, DO NOT CONFLATE (2026-08-20): hapax >= 1 is a REACHABILITY PROOF - a novel string cannot come from
    a bank, so it proves a tutor subprocess succeeded, and this is the reading that settles account-layer vs host-local by
    interleaving instances on one clock. hapax >= 3 is a CHOSEN QUALITY CUT (LIVE >=3, THIN 1-2, FALLBACK 0). The bimodal
    reuse histogram (near-empty bucket at 2) justifies treating 1 as novel; it does not justify the 3. Re-derive per instance
    each run. Bank sizes re-measured 2026-08-21: pub 18, hub 18, sprout-qwen3.5-0.8b 64, legion-gemma3-12b 29, nomad-gemma4-e2b
    15, thor 48, mcnugget 36, cbp-gemma3-4b 23, cbp-qwen3.5 46 - bank CONTENT identifies WHICH instance fell back. Tool: private-context/archivist/tools/hapax.py.
    Supersedes the retired <=95/>=250 max-turn-char threshold; for why that rule failed, and on which 8 of 13 instances, see
    finding_2026_08_21_retired_char_rule_had_one_cause.'
  tutor_regime_finding_2026_07_30: 'STRUCTURAL, affects all historical quality analysis. Raising sessions come in three regimes
    — live adaptive Claude tutor, silent static-bank fallback, and a fixed replayed prompt list — and NO field in the session
    artifact distinguishes them. Any metric computed over pooled sessions (avg turn length, volume, ''thin session'', cross-instance
    strength ranking) is partly measuring WHICH PROMPT SOURCE RAN. Normalise within regime, or compare a response only against
    its own prompt. Reconstruction: private-context/archivist/state/tutor_regime.json. OWNER-ACTION (small, high leverage):
    record the regime in the session JSON — set a `tutor_source` field where generate_teacher_turn() decides, and log the
    reason _call_claude() returned None instead of swallowing it. One field retroactively un-confounds the entire corpus going
    forward.'
