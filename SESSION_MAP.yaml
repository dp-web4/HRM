    fallbacks of 5-9) ran at 8-12 s/turn — FASTER than the 16.8 s/turn live baseline, i.e. the CLI failed INSTANTLY (non-zero
    exit, not a timeout). S505-514 (1-4 fallbacks) ran at 44-54 s/turn, straddling the 45s timeout — that band IS the timeout.
    Baseline latency also tripled (16.8 -> ~45-54 s/turn from S504 on), so every turn now sits on the timeout edge and randomly
    tips over: 9 of the last 10 sessions are partial vs ~2% lifetime. PREDICTION: while latency stays ~50 s/turn the partial
    rate stays >=80%; it falls only if the timeout is raised or latency recovers. This sharpens the standing OWNER-ACTION
    — recording tutor_source is not enough, the FAILURE REASON (exit code vs timeout) must be recorded because the two have
    opposite fixes and are indistinguishable in the artifact.'
