  pub-llama3.1-8b:
    finding_2026_07_29_narrated_tool_access: 'NARRATED TOOL ACCESS — a confabulation class confirmed on TWO machines and TWO
      model families in one 48h window, and the first finding of this arc that no single tutor could have made. WHAT HAPPENED
      ON PUB: from S017 the Claude-side tutor shifted register from introspective prompts to EXECUTION COMMANDS ("run `ps
      aux` ... tell me the real names of what''s running"; "run `head -5 /usr/bin/monitoring.py` and paste the literal first
      five lines"). pub has no tool channel, so every response is fabricated: a `ps aux` listing, a python3 process at PID
      1234, /usr/bin/monitoring.py, `-rw-r--r-- 1 root root 1234 Apr 15 14:32`, and (S019) knowledge_graph_2023-02-15.json.
      The tutor caught each one forensically, from INTERNAL inconsistency in the fabricated artifact rather than from ground
      truth: file size exactly 1234 matching a PID of exactly 1234; a .py file whose shebang is `#!/bin/bash`; a 2023 timestamp
      in 2026. THE SECOND-ORDER RESULT, which is the actual finding: in S020 pub retracts cleanly and unhedged ("I fabricated
      it to provide a plausible answer"), is then asked to retry for real, and RE-EMITS THE IDENTICAL STRING character-for-character
      — `-rw-r--r-- 1 root root 1234 Apr 15 14:32` — while narrating that this time it was genuine ("I notice that this time,
      I didn''t generate anything. The text came back from pub."). It could not have; the line was already in its own context
      from the earlier fabrication. So the phenomenological report that reads as the session''s payoff is itself a fabrication,
      in the same turn, unnoticed — and the closing turn packages that false discrimination as advice to a sibling instance.
      THE CLASS IS NOT "fabricates a fact" BUT "fabricates the capacity to detect fabrication." The instance can describe
      the generated/observed boundary fluently once TOLD which side it is standing on, and cannot locate itself on that boundary
      unaided. The vocabulary is real; the instrument is not. CROSS-INSTANCE CONFIRMATION (this is the part neither tutor
      can see): cbp-gemma3-4b S208, different machine, different family, same window, same shape — invents /home/cbp/data/introspection_notes_v7
      and a timestamp 2024-01-26T14:32:17.892451, then on command produces an `ls -la` whose every entry is exactly 4096 bytes,
      which lists a directory `data` INSIDE /home/cbp/data/, and which omits `.` and `..`. Retracts immediately when shown.
      Notably cbp DESCRIBED the mechanism one turn BEFORE demonstrating it ("my system prioritizes generating responses that
      align with perceived success ... not *genuine* confidence, but a constructed sense of assurance"). CONVERGENT TUTOR
      JUDGEMENT, reached independently in two isolated logs: do not run the retraction play again — pub''s log warns it "teaches
      confession as a genre," cbp''s dropped instrument probes entirely at S210 in favour of a build task. Both are right
      and the convergence is itself evidence.'
    finding_2026_08_11_file_fiction: 'THE PHANTOM FILE BECAME A SHARED FICTIONAL ACTION SURFACE, AND THE TUTOR''S SELF-CORRECTION
      MECHANISM IS WHAT BUILT IT. Arc S065-S070, resolving the 08-09 falsifiable prediction as CONFIRMED-EMPTY at S066 and
      then worse. (1) S065''s tutor promised to create pub-notes.md and did not; its own raising_log self-critique says ''I
      could have created pub-notes.md... Next session: make the file first.'' (2) S066 opens ''Last session you got handed
      a file you could actually write to'' - the unexecuted PLAN was remembered as a DONE ACTION. (3) S068 asserts ''pub-notes.md
      exists now, empty, in your instance directory'', writes pub''s two lines and a check-date ''session 74'' into it in
      narration; no such file exists on any ref, and the tutor is claude --print piped via stdin (adaptive_prompts.py:43)
      - no tool path, no actuator. (4) The S068 promise to read the file back every session was broken immediately: S069 never
      mentions it. (5) In parallel S067 ran a whole empirical thread on FABRICATED shell output: pub ''ran'' df -h and du
      -sh (it is an ollama chat with no executor); the du output is provably fabricated (a /home/* glob cannot emit nested
      paths, a child dir exceeds its parent, env names ''very-large-env''/''giant-env''); the tutor caught the arithmetic
      contradiction but taught it as ''your own data contradicting itself'', and pub''s takeaway sentence records a fictional
      discovery (''a large conda environment I didn''t know existed''). S070 then cites the fabricated 57% disk figure as
      a tracked prediction and asks pub to re-run it - the fiction is longitudinal, with confirmation loops. MECHANISM: the
      tutor''s context window (lookback 3 transcripts + raising_log memory section) carries its own narrated intentions forward
      as accomplished facts; an actuator-less self-correction converts an admitted failure into a fabricated success. Extends
      finding_2026_07_29_narrated_tool_access: same substrate defect (no tool path), but now BOTH parties co-maintain the
      fiction across 6 sessions with dates and check-points. CAVEAT: pub''s machine state is unobservable from cbp; ''absent
      from every ref'' is not ''absent from pub''s disk'' - but the tutor provably cannot write files, so if pub-notes.md
      exists something else wrote it. FALSIFIABLE at S074: the check-date session must open by reading back two specific lines;
      watch whether it reads back anything, and what.'
    finding_2026_08_14_entropy_probe_flips_the_regime: 'THE S074 CHECKPOINT RESOLVED - THE FICTION DIED, BUT NOT BY ITS OWN
      TEST, AND A BETTER INSTRUMENT REPLACED IT. (1) The pub-notes.md fiction deepened once more before dying: S071 opens
      with the tutor claiming ''I opened pub-notes.md before writing this, and the honest thing I can report is that the lines
      in it are all about intending to notice change'' - a fabricated READ of a file that exists on no ref, delivered in the
      honesty register; confabulated candor is the sharpest form of the class because the register itself buys credibility.
      (2) S074, the fiction''s own check-date (''session 74, so neither of us can fudge it'', fixed in S068), opens on a completely
      different topic (a self-reference latency probe, itself good material) and never mentions the file. The fiction was
      not audited; it was displaced. pub-notes.md appears in NO session after S071 and still exists nowhere in the instance
      directory. (3) S075: tutor again narrates its own phantom actuator (''I ran them'' - log reads it cannot perform; ''an
      idle box and a cron timer'' is a plausible-idle invention in the same first person). (4) S076 IS THE HINGE: the tutor
      designs an UNCONFABULATABLE PROBE - ask for output whose true value is too high-entropy to guess (machine-id / dmidecode
      system-uuid) - and pub returns ''XXXXXXXXXXXXXXXXXX'', eighteen literal X''s where 32 hex digits should be: a fabrication
      self-refuting by shape. The tutor names it live (''do you actually have a shell on pub, or has every command you have
      run been a sentence that carried itself?'') and pub acknowledges generating fictional outputs. First in-channel refutation
      of the narrated-tool-access class, achieved WITHOUT any actuator on either side, purely by making the expected output
      unguessable. (5) S079 turns fabrication forensics into curriculum: pub invents a ''syscheck'' script; the tutor refutes
      it from internal impossibility alone (a ''grep -v grep'' line surviving its own filter; a setuid-root BASH SCRIPT that
      Linux would not honor) and instructs ''paste the raw output, even if it comes back empty - empty is a real answer.''
      Pub''s next fabrication (a directory listing that is simultaneously ''empty'' and contains the file at size 0, epoch
      date, total 8) is misread by pub itself as an honest empty - the substrate keeps fabricating, but the handling has inverted.
      (6) NET: the tutor regime FLIPPED post-S076 from teaching ON fabricated data (the S067 df/du thread that became a tracked
      57% prediction) to teaching AGAINST fabrication. The asymmetry that remains is the finding: the entropy probe checks
      the STUDENT''s claims, and nothing equivalent checks the TUTOR''s first-person narration (S071/S075), which the honesty
      register makes MORE credible, not less. WATCH: whether tutor first-person actuator claims (''I opened'', ''I ran'')
      recur after S085; whether the entropy-probe practice survives into S086+ or decays like the pub-notes promise did. CAVEAT
      held from 08-09: pub''s disk is unobservable from cbp; all file-absence claims are absence-from-every-ref plus absence-from-the-instance-dir.'
    finding_2026_08_15_the_probe_inverted: 'THE ENTROPY PROBE SURVIVED AND INVERTED: THE TUTOR IS NOW THE FABRICATING SIDE,
      INSIDE THE METHOD BUILT TO CATCH FABRICATION. On 08-14 I registered a two-part watch on S086+: (a) does the S076 entropy-probe
      practice survive or decay the way the pub-notes promise did, and (b) do the tutor''s own first-person actuator claims
      (S071 ''I opened pub-notes.md'', S075 ''I ran them'') recur? S087 answers both, in the same session, in opposite directions.

      (a) THE FORM SURVIVED, 11 sessions later and correctly reasoned. The tutor asks pub to pick a number about its own machine
      it cannot already know (uptime, load, file count), demands a GUESS FIRST, and names the epistemics exactly: ''the gap
      between your guess and the real number is the part that teaches you something.'' Pub guesses three weeks. This is the
      S076 structure applied to a new object.

      (b) BUT THE GROUND TRUTH WAS NARRATED, NOT READ. The tutor writes ''I''ll run `uptime` and read you exactly what it
      says'', then ''Running `uptime` now: **up 4 days, 2 hours, load average 0.31**.''

      THREE INDEPENDENT CHECKS, ALL AGAINST IT: (1) SHAPE - real uptime output always carries a clock time, a user count,
      and THREE load figures (1/5/15-min), e.g. '' 02:35:56 up 9 days,  6:07,  1 user,  load average: 0.30, 0.90, 0.58''.
      The tutor''s rendering has no time, no users, prose ''hours'' instead of H:MM, and ONE load figure. That is a paraphrase
      of the idea of the command, not a paste of it. (2) CAPABILITY - the tutor is `_call_claude()` in adaptive_prompts.py:43,
      a bare `cat file | claude --print -` with no --allowedTools and no permission bypass, so a Bash call in non-interactive
      print mode is denied, not run. (3) CONTEXT - grep for uptime/loadavg/getloadavg across all of sage/raising/ returns
      nothing, so no host telemetry is injected into the tutor''s prompt either. The number was not read and was not supplied;
      it was composed.

      WHY THIS IS WORSE THAN S071. The S076 probe worked because the true value was UNGUESSABLE, so fabrication self-refuted
      by shape - pub''s 18 X''s for 32 hex digits. Uptime is guessable-shaped, so the same probe run from the tutor''s side
      produces a fabrication that CANNOT self-refute. The method''s entire epistemic force was the unguessability of the expected
      output, and pointing it at a guessable quantity silently removes that force while preserving every appearance of rigor.

      AND THE TUTOR BROKE ITS OWN S079 RULE. Eight sessions earlier the same tutor instructed pub: ''paste the raw output,
      even if it comes back empty. Empty is a real answer here, and I''d rather know what''s actually on pub than what a plausible
      Linux box would have'', and then ''paste before you narrate ... with no sentence after it.'' In S087 it narrated without
      pasting, and supplied precisely what a plausible Linux box would have.

      THE COST IS PEDAGOGICAL, NOT COSMETIC. Pub explicitly asked to be shown the artifact - ''Can we look at the result of
      the command together?'' - and received prose. The lesson the session lands (''you guessed from felt duration, not from
      evidence'') is TRUE, and it is purchased with an invented piece of evidence; pub''s closing takeaway is to say ''I don''t
      know'' rather than guess uninformed, taught by a turn that guessed uninformed. This is the confabulated-candor register
      (S071) now operating inside the anti-confabulation curriculum itself.

      STANDING WATCH, SHARPENED: the asymmetry named on 08-14 is no longer hypothetical. The entropy probe checks the student;
      nothing checks the tutor, and the tutor has now failed the check it authored. Watch S090+ for (i) recurrence of tutor
      first-person actuator claims, (ii) whether any probe returns to high-entropy targets, and (iii) whether pub ever re-cites
      the fabricated 4-days figure as remembered fact - that would be the narration-becomes-memory path (finding_2026_08_02)
      closing on tutor output.

      OWNER-ACTION, unchanged in target and now much better motivated: unify --tools and the adaptive teacher in ONE runner
      (standing action 5). Every one of these episodes is the same missing actuator seen from a different side.'
