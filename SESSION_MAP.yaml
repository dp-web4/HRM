  integrity_repair_2026_07_26: 'THIS FILE HAS NOT BEEN VALID YAML SINCE 2026-07-18 (commit f7bf2545b) AND NO RUN NOTICED FOR
    8 DAYS. The 07-18 archivist pass inserted note_2026_07_18_09_45 and in doing so clobbered the KEY of note_2026_07_15_11_00,
    leaving that note''s quoted string dangling directly after the previous one (''... Totals: 2062 -> 2081." "Daily scan
    ~24h since 07-14 11:00...''). yaml.safe_load has failed on line 24 ever since. Five archivist runs (07-18, 07-22, 07-23,
    07-24/25, and the 07-25 pass) each reported ''updated SESSION_MAP.yaml'' while the file was unparseable, because the Archivist
    WRITES yaml but READS it with grep and sed — it never once exercised its own output format. Root cause is structural,
    not clerical: an artifact whose stated purpose is ''machine-readable session data'' was never machine-read. REPAIRED 2026-07-26
    (key restored, file now parses; no content lost — the orphaned string was intact, only its key was missing). NEW STANDING
    RULE: every archivist run must yaml.safe_load this file after editing and before committing. Generalization worth carrying:
    this is the same class as the run_archivist.ps1 blindness (a launcher that discarded stdout looked identical in success
    and failure) — a producer that never consumes its own output cannot detect its own corruption. Check the other SESSION_MAP.yaml
    files on the same suspicion.'
